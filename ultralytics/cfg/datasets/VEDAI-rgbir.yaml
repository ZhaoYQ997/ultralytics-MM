# VEDAI RGB+IR paired detection dataset example config for YOLO11 training/inference

path: /data/VEDAI
train: images/rgb/train
val: images/rgb/val
test: images/rgb/test
ir: /data/VEDAI/images/ir
channels: 4
modality: rgbir
modal_root: /data/VEDAI/images/ir
modal_suffix: ir

names:
  0: car
  1: truck
  2: tractor
  3: camping-car
  4: van
  5: pickup
  6: ship
  7: plane
  8: other-vehicle
